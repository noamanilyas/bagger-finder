services:
  - type: web
    name: bagger-finder
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /api/listings
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # set in the Render dashboard; without it a basic heuristic parser is used
      - key: EXTRACT_MODELS
        value: google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free,openrouter/free
      - key: AUTO_SCRAPE
        value: "true"
