services:
  - type: web
    name: bagger-finder
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # set in the Render dashboard; without it a basic heuristic parser is used
      - key: EXTRACT_MODELS
        value: google/gemma-4-31b-it:free # tried first; other free models are discovered automatically
      - key: AUTO_SCRAPE
        value: "true"
      # Sign-in: set these in the Render dashboard. Without WORKOS_CLIENT_ID the site refuses every request.
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_COOKIE_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_WORKOS_REDIRECT_URI
        sync: false # https://<your Render address>/callback
      - key: ALLOWED_EMAILS
        sync: false
